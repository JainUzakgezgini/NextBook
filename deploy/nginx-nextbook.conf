# /etc/nginx/sites-available/nextbook
# Nginx receives visitors on port 80 and passes them to gunicorn on 127.0.0.1:8000.
# Certbot (Let's Encrypt) later adds the HTTPS (443) part and the http -> https redirect.
server {
    listen 80 default_server;
    server_name nextbook.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
